# Expanded test config — hits ALL benchmark categories (A–J) except I (remote).
# Uses the public remote Azure Parquet dataset via `input:`.

azure:
  storage_account: "nwcsandboxstorage"
  container: "waveforms"
  anonymous: true

studies:
  - name: "suppression_study"
    input: "parquet/Suppression~ B_54c97daa-933a-46fc-ab0e-dcfb65a0d724.float32.snappy.parquet/"
    sample_freq: 256

# ─── Core benchmarks (A–E): run on every generated variant ────────
benchmarks:
  - random_access
  - channel_subset
  - remontage
  - filter_pipeline
  - window_scaling
  # Parquet-specific (F, G, H)
  - compression
  - precision_loss
  - int32_storage
  # Cross-format (J)
  - tuned_comparison

# ─── Variants for core benchmarks ─────────────────────────────────
variants:
  - format: hdf5
    layout: columnar
    chunk_minutes: 5
    dtype: float32
    compression: lz4
  - format: hdf5
    layout: rowgroup
    chunk_minutes: 5
    dtype: float32
    compression: lz4
  - format: edf

# ─── Benchmark parameters ─────────────────────────────────────────
window_sizes: [10, 30, 60, 300, 900, 1800, 3600]
channel_subsets: [4, 10]
read_positions: [0.0, 0.5, 0.75, 0.95]
default_window: 60
repetitions: 3

# ─── Parquet compression variants for benchmark F ─────────────────
parquet_compression:
  - codec: "none"
  - codec: "snappy"
  - codec: "zstd"
    level: 3
  - codec: "lz4"

# ─── Tuned comparison block sizes for benchmark J ─────────────────
tuned_block_sizes_minutes: [5, 10, 20, 30, 60, 120]

cache_dir: ".benchmark_cache"

