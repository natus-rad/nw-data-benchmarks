# ============================================================================
# EEG Format Benchmark Configuration
# ============================================================================
# Compares read performance, compression, and precision across EDF, HDF5,
# and Apache Parquet for clinical EEG / PSG data at scale.
#
# INPUT MODEL
# -----------
# Each study must define `input:` pointing to either:
#   - a local file or directory in a supported format (.edf, .h5/.hdf5,
#     .parquet file/dir, or ERD directory), or
#   - a remote Azure blob path/URL for public data we already host.
#
# Remote inputs are downloaded into the configured `cache_dir` using the
# dataset's leaf name, then ingested from that cached local copy.
# If that cached remote input already exists, it is reused and not
# downloaded again.
#
# Note: directory-style remote inputs are currently treated as cached when
# `.download_complete` exists and at least one cached file remains. That is
# a fast cache-hit heuristic, not a full sync/repair check against Azure.
#
# AZURE AUTHENTICATION
# --------------------
#   Azure settings are needed for remote `input:` resolution and for the
#   optional remote-query benchmark section further below. The default storage
#   account uses anonymous (public) read access. For private containers:
#     1. Run `az login` (uses DefaultAzureCredential)
#     2. Set AZURE_STORAGE_SAS_TOKEN env var
#     3. Pass --sas-token on the command line

azure:
  storage_account: "nwcsandboxstorage"
  container: "waveforms"
  anonymous: true

studies:
  - name: "suppression_study"

    # --- Universal input path ---
    # This can be either a local path or a remote Azure blob prefix/URL.
    # The default points at the public Parquet dataset we've been using.
    input: "parquet/Suppression~ B_54c97daa-933a-46fc-ab0e-dcfb65a0d724.float32.snappy.parquet/"

    # --- Sample frequency (Hz) ---
    # Required for EDF inputs. Optional for HDF5 / ERD when the source metadata
    # can provide it, but still recommended for reproducible cached reruns.
    # For Parquet inputs, keep specifying it explicitly unless your workflow
    # guarantees the samplestamp unit matches the sampling rate.
    sample_freq: 256

    # If you enable the `remote_query` benchmark below, also update the
    # `parquet_investigations.remote_query` paths so they refer to the same
    # study as this input.

cache_dir: ".benchmark_cache"

benchmarks:
  - random_access        # A: read position scaling
  - channel_subset       # B: columnar read advantage
  - remontage            # C: read + bipolar montage
  - filter_pipeline      # D: read + montage + filter + FFT
  - window_scaling       # E: window size throughput
  - compression          # F: Parquet codec comparison
  - precision_loss       # G: EDF 16-bit quantization error
  - int32_storage        # H: int32 storage modes
  - remote_query         # I: remote Parquet (DuckDB) vs EDF download
  - tuned_comparison     # J: tuned Parquet vs HDF5 (matched block sizes)

# Parquet-specific benchmark configuration.
parquet_investigations:
  compression:
    enabled: true
    variants:
      - codec: "none"
      - codec: "snappy"
      - codec: "zstd"
        level: 3
      - codec: "zstd"
        level: 9
      - codec: "lz4"
  precision_loss:
    enabled: true
  int32_storage:
    enabled: true
  remote_query:
    enabled: true
    n_random_points: 2
    window_sec: 600
    full_study_chunk_sec: 3600   # chunk size for full-study sequential read; omit to skip
    remote_float32_path: "parquet/Suppression~ B_54c97daa-933a-46fc-ab0e-dcfb65a0d724.float32.snappy.parquet/"
    remote_int32_nanovolt_path: "parquet/Suppression~ B_54c97daa-933a-46fc-ab0e-dcfb65a0d724.int32_nanovolt.snappy.parquet/"
    remote_single_file_path: "parquet/tuned_pq_lz4_10m.parquet"

# Window sizes for category E (seconds).
window_sizes: [10, 30, 60, 300, 900, 1800, 3600]

# Block sizes for category J tuned comparison (minutes).
# Each size generates a Parquet (snappy + lz4) and HDF5 (LZ4) variant.
tuned_comparison:
  block_sizes_minutes: [5, 10, 20, 30, 60, 120]

# Channel subsets for category B.
channel_subsets: [4, 10]

# Generic benchmark variants generated from the canonical Parquet input.
# The first Parquet variant becomes the default `parquet` path used by the
# core benchmark categories, so keep the recommended baseline first.
variants:
  - format: parquet
    row_group_minutes: 30
    compression: lz4

# Read positions for category A (fraction of total duration).
read_positions: [0.0, 0.5, 0.75, 0.95]

# Fixed window for categories A, B, C (seconds).
default_window: 60

# Number of repetitions per benchmark.
repetitions: 3

