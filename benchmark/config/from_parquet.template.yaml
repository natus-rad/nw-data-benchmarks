# ═══════════════════════════════════════════════════════════════════
# Parquet Input -- Benchmark Config Template
# ═══════════════════════════════════════════════════════════════════
# Copy this file, edit the input path, and comment out anything you
# don't need. Every available field and option is shown below.
#
# The input can be a local .parquet file / directory of Parquet part
# files, or a remote Azure blob path/URL to that dataset. The data must
# have float32 channel columns and an int64 samplestamp column. If it
# already matches the canonical schema, ingest links to it directly.
#
# Usage:
#   python benchmark/scripts/run_benchmarks.py --config my_config.yaml
# ═══════════════════════════════════════════════════════════════════

# --- Azure (required only for remote inputs) ------------------------
# Uncomment/edit this section if `studies[].input` points to Azure blob
# storage instead of a local file/directory.
# Remote inputs are cached under `cache_dir` and reused on later runs.
# For directory-style inputs, cache reuse is currently based on a
# `.download_complete` marker plus at least one cached file; it is not a
# full sync/repair pass against Azure.
azure:
  storage_account: "nwcsandboxstorage"     # Azure Storage account name
  container: "waveforms"                   # Blob container holding the input/remote datasets
  anonymous: true                           # true=public/anonymous reads; false=credentialed access

# --- Input ----------------------------------------------------------
studies:
  - name: "my_parquet_recording"           # Friendly study label used in results/reporting
    input: "/path/to/my_recording.parquet" # <-- EDIT THIS (local file/dir or Azure blob path/URL)
    sample_freq: 256                        # Sample rate in Hz; keep explicit for Parquet inputs

# --- Benchmarks -----------------------------------------------------
# Keep or comment rows to choose what runs. Every available benchmark is
# listed here, and `benchmarks:` is the only thing that decides what runs.
benchmarks:
  - random_access                           # A: Windowed read at various file positions
  - channel_subset                          # B: Read a subset of channels (columnar advantage)
  - remontage                               # C: Read + bipolar montage computation
  - filter_pipeline                         # D: Full-study chunked read + bandpass/notch DSP
  - window_scaling                          # E: Throughput vs window size (10s to 1hr)
  # - compression                           # F: Parquet codec comparison (uses parquet_investigations below)
  # - precision_loss                        # G: EDF 16-bit quantization error
  # - int32_storage                         # H: Int32 storage comparison
  # - remote_query                          # I: Remote Parquet (DuckDB) vs EDF download
  # - tuned_comparison                      # J: Tuned Parquet vs HDF5 (matched block sizes)

# --- Output Variants ------------------------------------------------
# Each entry generates one file from the canonical Parquet. The first
# Parquet variant becomes the default `parquet` path used by the core
# benchmark categories. Comment out or duplicate entries as needed.
# Variant fields:
#   format: parquet | hdf5 | edf
#   row_group_minutes: Parquet row-group target in minutes
#   layout: HDF5 layout (columnar or rowgroup)
#   chunk_minutes: HDF5 chunk target in minutes
#   dtype: currently only float32 is supported for HDF5 variants
#   compression: Parquet supports lz4/snappy/zstd/none; HDF5 currently supports only lz4
variants:
  - format: parquet                         # Generate a Parquet variant
    row_group_minutes: 5                    # Row-group size in minutes of data
    compression: lz4                        # lz4 | snappy | zstd | none

  - format: parquet
    row_group_minutes: 30
    compression: lz4

  - format: parquet
    row_group_minutes: 60
    compression: lz4

  - format: hdf5                            # Generate an HDF5 variant
    layout: columnar                        # columnar | rowgroup
    chunk_minutes: 5                        # Chunk size in minutes of data
    dtype: float32                          # Only float32 is supported for HDF5 for now
    compression: lz4                        # Only lz4 is supported for HDF5 for now

  - format: hdf5
    layout: columnar
    chunk_minutes: 30
    dtype: float32                          # Only float32 is supported for HDF5 for now
    compression: lz4                        # Only lz4 is supported for HDF5 for now

  - format: hdf5
    layout: columnar
    chunk_minutes: 60
    dtype: float32                          # Only float32 is supported for HDF5 for now
    compression: lz4                        # Only lz4 is supported for HDF5 for now

  - format: hdf5
    layout: rowgroup
    chunk_minutes: 30
    dtype: float32                          # Only float32 is supported for HDF5 for now
    compression: lz4                        # Only lz4 is supported for HDF5 for now

  - format: edf                             # Always 16-bit quantized

# --- Benchmark Parameters -------------------------------------------
repetitions: 3                              # Timing repetitions per measurement
default_window: 60                          # Default window size in seconds for A/B/C/F/G/H
window_sizes: [10, 30, 60, 300, 900, 1800, 3600]  # Window sizes for benchmark E
read_positions: [0.0, 0.5, 0.75, 0.95]     # Fractional file positions for benchmark A
channel_subsets: [4, 10]                    # Channel counts to test in benchmark B

# --- Optional benchmark-specific config -----------------------------
parquet_investigations:
  compression:                              # Benchmark F configuration
    enabled: true                           # false skips F even if `compression` is in benchmarks
    variants:                               # Codec variants generated for benchmark F
      - codec: "none"                      # Uncompressed Parquet
      - codec: "snappy"                    # Snappy-compressed Parquet
      - codec: "zstd"                      # Zstd-compressed Parquet
        level: 3                            # Zstd compression level for this entry
      - codec: "lz4"                       # LZ4-compressed Parquet
  precision_loss:                           # Benchmark G configuration
    enabled: true                           # false skips G even if `precision_loss` is in benchmarks
  int32_storage:                            # Benchmark H configuration
    enabled: true                           # false skips H even if `int32_storage` is in benchmarks
  remote_query:                             # Benchmark I configuration
    enabled: true                           # false skips I even if `remote_query` is in benchmarks
    n_random_points: 2                      # Number of random remote windows to query
    window_sec: 600                         # Duration of each random remote window in seconds
    full_study_chunk_sec: 3600              # Chunk size for optional full-study sequential remote reads
    remote_float32_path: "parquet/Suppression~ B_54c97daa-933a-46fc-ab0e-dcfb65a0d724.float32.snappy.parquet/"  # Azure blob path for float32 dataset
    remote_int32_nanovolt_path: "parquet/Suppression~ B_54c97daa-933a-46fc-ab0e-dcfb65a0d724.int32_nanovolt.snappy.parquet/"  # Azure blob path for int32-nV dataset
    remote_single_file_path: "parquet/tuned_pq_lz4_10m.parquet"  # Azure blob path for single-file tuned Parquet

tuned_comparison:
  block_sizes_minutes: [5, 10, 20, 30, 60, 120]  # Block sizes in minutes for benchmark J; benchmarks list controls whether J runs
  parquet_codecs: [snappy, lz4]                  # Tuned Parquet codecs to generate for benchmark J
  hdf5_compression: lz4                          # Only lz4 is currently supported for tuned HDF5 variants
  chunk_sec: 300                                 # Sequential chunk size in seconds for J.4 full-study reads

# --- Output ---------------------------------------------------------
cache_dir: ".benchmark_cache"              # Cache + generated-variant directory
# output: "results/my_benchmark_results.json"  # Optional explicit JSON output path

