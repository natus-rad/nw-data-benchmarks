# ═══════════════════════════════════════════════════════════════════
# EDF Input -- Benchmark Config Template
# ═══════════════════════════════════════════════════════════════════
# Copy this file, edit the input path, and comment out anything you
# don't need. Every available field and option is shown below.
#
# Usage:
#   python benchmark/scripts/run_benchmarks.py --config my_config.yaml
# ═══════════════════════════════════════════════════════════════════

# --- Azure (required only for remote inputs) ------------------------
# Uncomment/edit this section if `studies[].input` points to Azure blob
# storage instead of a local EDF file.
# Remote inputs are cached under `cache_dir` and reused on later runs.
# For directory-style inputs, cache reuse is currently based on a
# `.download_complete` marker plus at least one cached file; it is not a
# full sync/repair pass against Azure.
azure:
  storage_account: "nwcsandboxstorage"     # Azure Storage account name
  container: "waveforms"                   # Blob container holding the input/remote datasets
  anonymous: true                           # true=public/anonymous reads; false=credentialed access

# --- Input ----------------------------------------------------------
# The input EDF can be a local file or a remote Azure blob path/URL.
# It is ingested into canonical Parquet during setup, and all variants
# are then generated from that canonical Parquet.
studies:
  - name: "my_edf_recording"                # Friendly study label used in results/reporting
    input: "/path/to/my_recording.edf"     # <-- EDIT THIS (local file or Azure blob path/URL)
    sample_freq: 256                        # Required for EDF input

canonical_parquet:
  compression: snappy
  row_group_minutes: 30

variants:
  # Parquet variants -- tune row_group_minutes and compression
  - id: pq_5m_lz4
    format: parquet
    row_group_minutes: 5                    # Row group size in minutes of data
    compression: lz4                        # lz4 | snappy | zstd | none

  - id: pq_30m_lz4
    format: parquet
    row_group_minutes: 30
    compression: lz4

  - id: pq_60m_lz4
    format: parquet
    row_group_minutes: 60
    compression: lz4

  # HDF5 variants -- tune layout and chunk_minutes
  - id: h5_col_5m
    format: hdf5
    layout: columnar                        # columnar | rowgroup
    chunk_minutes: 5                        # Chunk size in minutes of data
    dtype: float32                          # Only float32 is supported for HDF5 for now
    compression: lz4                        # Only lz4 is supported for HDF5 for now

  - id: h5_col_30m
    format: hdf5
    layout: columnar
    chunk_minutes: 30
    dtype: float32                          # Only float32 is supported for HDF5 for now
    compression: lz4                        # Only lz4 is supported for HDF5 for now

  - id: h5_col_60m
    format: hdf5
    layout: columnar
    chunk_minutes: 60
    dtype: float32                          # Only float32 is supported for HDF5 for now
    compression: lz4                        # Only lz4 is supported for HDF5 for now

  # HDF5 rowgroup variant -- single matrix layout
  - id: h5_row_30m
    format: hdf5
    layout: rowgroup
    chunk_minutes: 30
    dtype: float32                          # Only float32 is supported for HDF5 for now
    compression: lz4                        # Only lz4 is supported for HDF5 for now

  # EDF variant -- always 16-bit quantized, no tunable parameters
  - id: edf_export
    format: edf

benchmarks:
  common:
    repetitions: 3
    default_window: 60
  core:
    random_access:
      enabled: true
      variants: all
      read_positions: [0.0, 0.5, 0.75, 0.95]
    channel_subset:
      enabled: true
      variants: all
      channel_subsets: [4, 10]
    remontage: {enabled: true, variants: all}
    filter_pipeline: {enabled: true, variants: all}
    window_scaling:
      enabled: true
      variants: all
      window_sizes: [10, 30, 60, 300, 900, 1800, 3600]
  parquet_investigations:
    compression:
      enabled: false
      variants:
        - codec: "none"
        - codec: "snappy"
        - codec: "zstd"
          level: 3
        - codec: "lz4"
    precision_loss: {enabled: false}
    int32_storage: {enabled: false}
    remote_query:
      enabled: false
      n_random_points: 2
      window_sec: 600
      full_study_chunk_sec: 3600
      remote_float32_path: "parquet/Suppression~ B_54c97daa-933a-46fc-ab0e-dcfb65a0d724.float32.snappy.parquet/"
      remote_int32_nanovolt_path: "parquet/Suppression~ B_54c97daa-933a-46fc-ab0e-dcfb65a0d724.int32_nanovolt.snappy.parquet/"
      remote_single_file_path: "parquet/tuned_pq_lz4_10m.parquet"
  other:
    tuned_comparison:
      enabled: false
      block_sizes_minutes: [5, 10, 20, 30, 60, 120]
      parquet_codecs: [snappy, lz4]
      hdf5_compression: lz4
      chunk_sec: 3600
    baseline_comparison:
      enabled: false
      chunk_sec: 3600

# --- Output ---------------------------------------------------------
cache_dir: ".benchmark_cache"               # Where generated files are stored
# output: "results/my_benchmark_results.json"  # Optional: override output path

