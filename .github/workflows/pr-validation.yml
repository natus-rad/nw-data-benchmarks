name: PR validation

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run pytest
        run: python -m pytest -q

  default-benchmarks:
    name: Default benchmark suite
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore benchmark cache
        uses: actions/cache@v4
        with:
          path: .benchmark_cache
          key: ${{ runner.os }}-default-benchmarks-${{ hashFiles('requirements.txt', 'benchmark/config/default.yaml') }}
          restore-keys: |
            ${{ runner.os }}-default-benchmarks-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run default benchmark suite
        run: >-
          python -m benchmark.scripts.run_benchmarks
          --config benchmark/config/default.yaml
          --output benchmark/results/ci_default_benchmark_results.json
          --no-report

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-default-benchmark-results
          path: benchmark/results/ci_default_benchmark_results.json
          if-no-files-found: warn

