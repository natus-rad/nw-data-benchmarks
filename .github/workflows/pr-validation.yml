name: PR validation

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  actions: read
  pull-requests: write

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run pytest
        run: python -m pytest -q

  default-benchmarks:
    name: Default benchmark suite
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 60

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore benchmark cache
        uses: actions/cache@v4
        with:
          path: .benchmark_cache
          key: ${{ runner.os }}-default-benchmarks-${{ hashFiles('requirements.txt', 'benchmark/config/default.yaml') }}
          restore-keys: |
            ${{ runner.os }}-default-benchmarks-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run default benchmark suite
        run: >-
          python -m benchmark.scripts.run_benchmarks
          --config benchmark/config/default.yaml
          --output benchmark/results/ci_default_benchmark_results.json

      - name: Upload benchmark results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-default-benchmark-results
          path: benchmark/results/ci_default_benchmark_results.json
          if-no-files-found: warn

      - name: Upload benchmark HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-default-benchmark-report-html
          path: benchmark/docs/benchmark_report.html
          if-no-files-found: warn

      - name: Comment on PR with benchmark artifacts
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const runId = context.runId;
            const prNumber = context.issue.number;
            const marker = '<!-- pr-validation-benchmark-artifacts -->';

            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner,
              repo,
              run_id: runId,
              per_page: 100,
            });

            const artifactLink = (name) => {
              const artifact = artifacts.find((entry) => entry.name === name);
              if (!artifact) {
                return `- ${name}: not available for this run`;
              }
              return `- ${name}: [download artifact](https://github.com/${owner}/${repo}/actions/runs/${runId}/artifacts/${artifact.id})`;
            };

            const runLink = `https://github.com/${owner}/${repo}/actions/runs/${runId}`;
            const body = [
              marker,
              '## Benchmark artifacts',
              '',
              'The default benchmark workflow has finished running for this PR.',
              '',
              `- Workflow run: [view run](${runLink})`,
              artifactLink('ci-default-benchmark-results'),
              artifactLink('ci-default-benchmark-report-html'),
              '',
              'Artifacts require GitHub access to this repository and can be downloaded from the links above.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
            }

